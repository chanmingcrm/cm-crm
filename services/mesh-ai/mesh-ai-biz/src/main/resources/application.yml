spring:
  application:
    # 应用名称
    name: @artifactId@
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration
      - org.springframework.ai.vectorstore.elasticsearch.autoconfigure.ElasticsearchVectorStoreAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
      - org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
      - org.springframework.ai.model.chat.memory.autoconfigure.ChatMemoryAutoConfiguration
  profiles:
    # 环境配置
    active: @profile.name@
  cloud:
    nacos:
      discovery:
        # 解决获取IP为内网，一般微服务采用内网安全性、可用性高
        # ip: 127.0.0.1
        # 服务注册地址
        server-addr: @discovery.server-addr@
        # 命名空间
        namespace: @discovery.namespace@
        # 配置组
        group: @discovery.group@
      config:
        # 配置中心地址
        server-addr: @config.server-addr@
        # 命名空间
        namespace: @config.namespace@
        # 配置组
        group: @config.group@
        # 配置文件格式
        file-extension: @config.file-extension@
    # 暂时修复因sentinel导致的无法启动
    openfeign:
      lazy-attributes-resolution: true
  config:
    import:
      - optional:nacos:mesh-environment-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  ai:
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        name: mesh-ai-mcp-server
        version: 4.1.0
        type: SYNC
        request-timeout: 60s
        capabilities:
          resource: false
          prompt: false
          completion: false
          tool: true
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s
