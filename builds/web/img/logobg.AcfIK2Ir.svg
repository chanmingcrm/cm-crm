<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义渐变 -->
  <defs>
    <!-- 主背景渐变 -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:1" />
    </linearGradient>
    
    <!-- 光晕渐变1 -->
    <radialGradient id="glow1">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0" />
    </radialGradient>
    
    <!-- 光晕渐变2 -->
    <radialGradient id="glow2">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0" />
    </radialGradient>
    
    <!-- 光晕渐变3 -->
    <radialGradient id="glow3">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- 主背景 -->
  <rect width="1920" height="1080" fill="url(#mainGradient)"/>
  
  <!-- 装饰性光晕 -->
  <circle cx="200" cy="150" r="400" fill="url(#glow1)"/>
  <circle cx="1700" cy="900" r="500" fill="url(#glow2)"/>
  <circle cx="960" cy="540" r="450" fill="url(#glow3)"/>
  
  <!-- 网格图案 -->
  <g opacity="0.08">
    <!-- 垂直线 -->
    <line x1="0" y1="0" x2="0" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="560" y1="0" x2="560" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="640" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="880" y1="0" x2="880" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="960" y1="0" x2="960" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="1040" y1="0" x2="1040" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="1120" y1="0" x2="1120" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="1200" y1="0" x2="1200" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="1280" y1="0" x2="1280" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="1360" y1="0" x2="1360" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="1520" y1="0" x2="1520" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="1600" y1="0" x2="1600" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="1680" y1="0" x2="1680" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="1760" y1="0" x2="1760" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="1840" y1="0" x2="1840" y2="1080" stroke="white" stroke-width="0.5"/>
    <line x1="1920" y1="0" x2="1920" y2="1080" stroke="white" stroke-width="0.5"/>
    
    <!-- 水平线 -->
    <line x1="0" y1="0" x2="1920" y2="0" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="1920" y2="80" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1920" y2="160" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1920" y2="240" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="1920" y2="320" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1920" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="480" x2="1920" y2="480" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="560" x2="1920" y2="560" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="640" x2="1920" y2="640" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="720" x2="1920" y2="720" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="800" x2="1920" y2="800" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="880" x2="1920" y2="880" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="960" x2="1920" y2="960" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="1040" x2="1920" y2="1040" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="1080" x2="1920" y2="1080" stroke="white" stroke-width="0.5"/>
  </g>
  
  <!-- 装饰性几何图形 -->
  <g opacity="0.06">
    <!-- 左上角圆环 -->
    <circle cx="150" cy="120" r="80" fill="none" stroke="white" stroke-width="1.5"/>
    <circle cx="150" cy="120" r="100" fill="none" stroke="white" stroke-width="1"/>
    
    <!-- 右下角方形 -->
    <rect x="1600" y="820" width="120" height="120" fill="none" stroke="white" stroke-width="1.5" rx="4"/>
    <rect x="1580" y="800" width="160" height="160" fill="none" stroke="white" stroke-width="1" rx="8"/>
    
    <!-- 中间区域装饰线条 -->
    <path d="M 800 400 L 900 350 L 1000 400 L 1100 350" fill="none" stroke="white" stroke-width="2"/>
    <path d="M 1200 700 L 1300 650 L 1400 700 L 1500 650" fill="none" stroke="white" stroke-width="2"/>
    
    <!-- 科技感点阵 -->
    <circle cx="500" cy="300" r="4" fill="white"/>
    <circle cx="550" cy="280" r="3" fill="white"/>
    <circle cx="600" cy="310" r="3" fill="white"/>
    <circle cx="650" cy="290" r="4" fill="white"/>
    
    <circle cx="1300" cy="400" r="4" fill="white"/>
    <circle cx="1350" cy="420" r="3" fill="white"/>
    <circle cx="1400" cy="390" r="3" fill="white"/>
    <circle cx="1450" cy="410" r="4" fill="white"/>
  </g>
  
  <!-- 渐变叠加层（模拟深度） -->
  <rect width="1920" height="1080" fill="url(#mainGradient)" opacity="0.3"/>
</svg>
