# 网桥 -> 方便相互通讯
networks:
  mesh-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "172.22.0.0/24"
services:
  # ----------------------------------------------------------------------------------------------------------------------------
  mysql:
    networks:
      mesh-network:
        ipv4_address: 172.22.0.10
    image: mysql/mysql-server:8.0.32
    container_name: mesh-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    hostname: mesh-mysql
    volumes:
      - ./volumes/mysql/mysql/my.cnf:/etc/mysql/my.cnf
      - ./volumes/mysql/conf.d:/etc/mysql/conf.d
      - ./volumes/mysql/data:/var/lib/mysql
      - ./volumes/mysql/logs:/logs
      - ./volumes/mysql/db:/docker-entrypoint-initdb.d
    environment:
      TZ: Asia/Shanghairedis 连接数153
      LANG: en_US.UTF-8
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo
    command: [
        'mysqld',
        '--innodb-buffer-pool-size=80M',
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_unicode_ci',
        '--default-time-zone=+8:00',
        '--lower-case-table-names=1'
      ]
  # ----------------------------------------------------------------------------------------------------------------------------
  redis:
    networks:
      mesh-network:
        ipv4_address: 172.22.0.15
    image: redis:7.2.4
    container_name: mesh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    hostname: mesh-redis
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - TZ=Asia/Shanghai
    volumes:
      - ./volumes/redis/data:/data
      - ./volumes/redis/config/redis.conf:/usr/local/etc/redis/redis.conf
    command:
      - redis-server
      - --bind 0.0.0.0  # 允许所有IP连接
      - --protected-mode no  # 关闭保护模式
      - --appendonly yes # 开启redis持久化配置
      - --requirepass 123456  # 设置密码（强烈建议）
  # ----------------------------------------------------------------------------------------------------------------------------
  elasticsearch:
    networks:
      mesh-network:
        ipv4_address: 172.22.0.20
    image: elasticsearch:8.16.6
    container_name: mesh-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./volumes/elasticsearch/data:/usr/share/elasticsearch/data
      - ./volumes/elasticsearch/logs:/usr/share/elasticsearch/logs
      - ./volumes/elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - ./volumes/elasticsearch/config/jvm.options:/usr/share/elasticsearch/config/jvm.options
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - bootstrap.memory_lock=true
      - network.host=0.0.0.0         # 关键设置：绑定到所有网络接口
      - http.host=0.0.0.0            # HTTP服务绑定
      - transport.host=0.0.0.0        # 内部通信绑定
      #      - ELASTIC_PASSWORD=YourSecurePassword123!
      - xpack.security.enabled=false  # 禁用安全认证
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200" ]
      interval: 30s
      timeout: 10s
      retries: 3
  # ----------------------------------------------------------------------------------------------------------------------------
  nacos:
    networks:
      mesh-network:
        ipv4_address: 172.22.0.25
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
      - "9555:9555"
    hostname: mesh-nacos
    volumes:
      - ./volumes/nacos/logs:/opt/nacos/logs
      - ./volumes/nacos/conf/application.properties:/opt/nacos/conf/application.properties
      - ./volumes/nacos/conf/cluster.conf:/opt/nacos/conf/cluster.conf
      - ./volumes/nacos/plugins/mysql:/opt/nacos/plugins/mysql
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - TZ=Asia/Shanghai
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=root
      - JVM_XMS=256m   #-Xms default :2g
      - JVM_XMX=256m   #-Xmx default :2g
      - JVM_XMN=64m    #-Xmn default :1g
      - JVM_MS=32m     #-XX:MetaspaceSize default :128m
      - JVM_MMS=32m    #-XX:MaxMetaspaceSize default :320m
      - NACOS_DEBUG=n  #是否开启远程debug，y/n，默认n
      - TOMCAT_ACCESSLOG_ENABLED=false #是否开始tomcat访问日志的记录，默认false
    depends_on:
      - mysql
  # ----------------------------------------------------------------------------------------------------------------------------
  xxl-job:
    networks:
      mesh-network:
        ipv4_address: 172.22.0.29
    image: xuxueli/xxl-job-admin:3.0.0
    container_name: xxl-job
    restart: unless-stopped                                      # 指定容器退出后的重启策略为始终重启，但是不考虑在Docker守护进程启动时就已经停止了的容器
    environment:
      # TODO 根据自己的配置修改，配置项参考源码文件：/xxl-job/xxl-job-admin/src/main/resources/application.properties
      PARAMS: "--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
               --spring.datasource.username=root
               --spring.datasource.password=root
               --server.servlet.context-path=/xxl-job-admin
               --xxl.job.accessToken=123456"
    ports:
      - "9003:8080"
    depends_on:
      - mysql
  # ----------------------------------------------------------------------------------------------------------------------------
  nginx-ui:
    networks:
      mesh-network:
        ipv4_address: 172.22.0.30
    container_name: mesh-ui
    restart: always
    image: mesh-ui
    environment:
      - TZ=Asia/Shanghai
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./volumes/nginx/html:/home/mesh-platform/mesh-ui
      - ./volumes/nginx/conf/crm_nginx.conf:/etc/nginx/crm_nginx.conf
      - ./volumes/nginx/logs:/var/log/nginx
      - ./volumes/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - mesh-gateway
    links:
      - mesh-gateway
  # ----------------------------------------------------------------------------------------------------------------------------
  mesh-gateway:
    networks:
      mesh-network:
        ipv4_address: 172.22.0.35
    container_name: mesh-gateway
    image: mesh-gateway
    restart: unless-stopped
    environment:
      - MODE=standalone
      - TZ=Asia/Shanghai
    build:
      context: ../..
      dockerfile: script/docker/server/Dockerfile
      cache_from: []
      args:
        APP_NAME: "mesh-gateway"
        APP_PORT: "8080"
        JAVA_OPTS: "-XX:+UseG1GC -Xms512m -Xmx2G -Xmn768m -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -XX:MaxGCPauseMillis=200"
    ports:
      - "8080:8080"
    depends_on:
      - nacos
      - redis
