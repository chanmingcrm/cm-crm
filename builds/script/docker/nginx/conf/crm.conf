server {
    server_name  crm.example.com;

    # ========== 添加 UTF-8 编码配置 ==========
    charset utf-8;

    # --- [变更 1: 全局拦截 Headless 浏览器] ---
    # 在 server 块顶部添加，对所有进入该域名的请求生效
    if ($http_user_agent ~* "HeadlessChrome|Headless") {
        return 403;
    }

    # --- [变更 2: 禁止访问敏感文件 (防御性配置)] ---
    # 防止通过 URL 访问到服务器上的敏感文件
    location ~ ^/(privkey\.pem|fullchain\.pem|.*\.key|.*\.crt)$ {
        deny all;
        return 404;
    }

    location / {
        root   /opt/ui/crm;
        index  index.html index.htm;
	try_files $uri $uri/ /index.html;
    }

    # 必须放在通用 /pro-api/ 之前
    location ~ ^/pro-api/.*/file/upload$ {

        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 关键：传递原始 Content-Type，保留 boundary 信息
        proxy_set_header Content-Type $http_content_type;
        proxy_pass_request_headers on;

        # 上传超时与大小限制
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500M;

        # ========== 修改响应头 ==========
        add_header Content-Type "application/json;charset=utf-8" always;
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

        # ========== 处理 OPTIONS 预检请求 ==========
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # 正则匹配，必须放在通用 /pro-api/ 之前
    location ~ ^/pro-api/.*import$ {

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 传递原始 Content-Type
        proxy_set_header Content-Type $http_content_type;

        # 增加超时时间 (Excel 解析非常耗时)
        proxy_read_timeout 600s; # 10分钟
        proxy_send_timeout 600s;

        # ========== 修改响应头 ==========
        add_header Content-Type "application/json;charset=utf-8" always;
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

        # ========== 处理 OPTIONS 预检请求 ==========
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # AI 对话接口包含 SSE 流式响应，必须保留上游媒体类型并关闭代理缓冲。
    # 该规则必须放在通用 /pro-api/ 代理之前，避免 Accept 被强制改为 JSON。
    location ^~ /pro-api/mesh-ai-biz/ai/chat/ {
        proxy_pass http://127.0.0.1:8080/mesh-ai-biz/ai/chat/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;

        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API接口转发
    location ^~/pro-api/{
	proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ========== 新增：UTF-8 编码相关头 ==========
        # 只有非文件上传请求才覆盖Content-Type
        # proxy_set_header Content-Type $http_content_type;

        proxy_set_header Accept-Charset "utf-8";
        proxy_set_header Accept "application/json;charset=utf-8";
        proxy_set_header Content-Type "application/json;charset=utf-8";
        # ========== 传递原始请求头 ==========
        proxy_pass_request_headers on;

        # 增加超时时间 (Excel 解析非常耗时)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # ========== 修改响应头 ==========
        add_header Content-Type "application/json;charset=utf-8" always;
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

        # ========== 处理 OPTIONS 预检请求 ==========
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    listen 80;
}

